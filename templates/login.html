<!DOCTYPE html>
<html>

<head>

    <title>BDVM BOT Login</title>

    <style>

        body{
            font-family: Arial;
            background:#f4f4f4;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .login-box{

            background:white;
            padding:40px;
            border-radius:15px;
            width:300px;
            box-shadow:0 0 10px rgba(0,0,0,0.1);
            text-align:center;
        }

        input{

            width:100%;
            padding:12px;
            margin-top:10px;
            border:1px solid #ccc;
            border-radius:8px;
        }

        button{

            width:100%;
            padding:12px;
            margin-top:20px;
            border:none;
            border-radius:8px;
            background:#ff9900;
            color:white;
            font-size:16px;
            cursor:pointer;
        }

    </style>

</head>

<body>

    <div class="login-box">

        <h2>BDVM BOT</h2>

        <form method="POST">

            <input
                type="text"
                name="username"
                placeholder="Username"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

    </div>

</body>

</html>
